name: Tests
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26', '1.27']
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Unit tests
        run: go test -coverprofile=cover.out ./...

      - name: Modver
        if: ${{ github.event_name == 'pull_request' && matrix.go-version == '1.27' }}
        run: go run ./cmd/modver -pr https://github.com/${{ github.repository }}/pull/${{ github.event.number }} -token ${{ github.token }} -pretty
        continue-on-error: true

      - name: Send coverage
        if: ${{ matrix.go-version == '1.27' }}
        uses: shogo82148/actions-goveralls@v1
        with:
          path-to-profile: cover.out
        continue-on-error: true
